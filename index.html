<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormulaBridge – Excel Formula Translator</title>
    <meta name="description" content="Write Excel formulas in any language. Automatic translation across 18 languages." />

    <!-- Office.js – MUST be loaded from CDN, not bundled -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

    <!-- Fluent UI Web Components -->
    <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>

    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="fb-header">
        <div class="fb-header__brand">
          <span class="fb-header__icon">🌉</span>
          <h1 class="fb-header__title">FormulaBridge</h1>
        </div>
        <div class="fb-header__status" id="status-badge">
          <span class="fb-status-dot fb-status-dot--inactive"></span>
          <span class="fb-status-text">Initializing…</span>
        </div>
      </header>

      <!-- Controls -->
      <section class="fb-section" id="controls-section">
        <div class="fb-control-row">
          <label class="fb-label" for="auto-detect-toggle">Auto-Detect</label>
          <fluent-switch id="auto-detect-toggle" checked></fluent-switch>
        </div>
        <div class="fb-control-row" id="language-selector-row">
          <label class="fb-label" for="source-language">Source Language</label>
          <fluent-select id="source-language" disabled>
            <fluent-option value="auto" selected>Auto-Detect</fluent-option>
          </fluent-select>
        </div>
        <div class="fb-control-row">
          <label class="fb-label" for="auto-translate-toggle">Auto-Translate</label>
          <fluent-switch id="auto-translate-toggle" checked></fluent-switch>
        </div>
      </section>

      <!-- Translation Log -->
      <section class="fb-section">
        <div class="fb-section-header">
          <h2 class="fb-section-title">Translation Log</h2>
          <button class="fb-btn-ghost" id="clear-log-btn" title="Clear log">✕</button>
        </div>
        <div class="fb-log" id="translation-log">
          <div class="fb-log__empty">No translations yet. Start typing formulas!</div>
        </div>
      </section>

      <!-- Formula Reference -->
      <section class="fb-section">
        <div class="fb-section-header">
          <h2 class="fb-section-title">Formula Reference</h2>
        </div>
        <div class="fb-search">
          <input type="text" class="fb-search__input" id="reference-search" placeholder="Search functions…" />
        </div>
        <div class="fb-reference" id="formula-reference">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Batch Translate -->
      <section class="fb-section">
        <button class="fb-btn-primary" id="batch-translate-btn">
          🔄 Translate Entire Sheet
        </button>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
